# The server version of nginx.conf (docker-compose.prod.yml mounts it over the default): the same app serving, plus
# /api/* passed to the backend, so the whole site has one address behind Caddy.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # the API: /api/recommend/ -> backend /recommend/
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 180s;          # an AI answer or a learning plan can take a while
        client_max_body_size 10m;         # a CV or certificate upload
    }

    # built files have a hash in their name, so they can be kept for a year
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # a page address such as /dashboard is a route inside the app, not a file
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
