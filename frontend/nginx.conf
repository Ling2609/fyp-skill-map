# Serves the built app. A page address such as /dashboard or /jobs/123 is a route inside the app, not a file,
# so anything that is not a file gets index.html (otherwise reloading such a page would show nginx's 404).
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # built files have a hash in their name, so they can be kept for a year
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
